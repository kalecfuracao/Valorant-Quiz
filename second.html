<html>
<head>
    <title>Second Question</title>
    <meta charset="UTF-8">

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

      body {
        background: radial-gradient(circle at top, #0f1923, #000);
        color: #FF4655;
        font-family: 'Orbitron', sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
      }

      h1 {
        font-size: 38px;
        margin-top: 40px;
        text-shadow: 0 0 12px rgba(255, 70, 85, 0.5);
      }

      p {
        font-size: 22px;
        max-width: 850px;
        margin: 20px auto;
        line-height: 1.4;
        opacity: 0.95;
        color: #e3e3e3;
      }

      /* IMAGENS LADO A LADO */
      .images {
        display: flex;
        justify-content: center;
        gap: 20px; /* gapzinho entre as imagens */
        margin-top: 20px;
      }

      .images img {
        height: 220px;
        border: 2px solid #FF4655;
        border-radius: 12px;
        transition: 0.3s;
      }

      .images img:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(255, 70, 85, 0.5);
      }

      /* BOTÕES ABAIXO DAS IMAGENS */
      .options {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px; /* igual ao estilo Lux */
        margin-top: 15px;
      }

      .options p {
        margin: 0 5px;
        font-size: 22px;
        color: #ffffff;
      }

      button {
        background: linear-gradient(135deg, #1a1a1d, #2d2d31);
        border: 2px solid #FF4655;
        color: #FF4655;
        padding: 10px 28px;
        font-size: 20px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        font-family: 'Orbitron', sans-serif;
      }

      button:hover {
        background: #3a3a40;
        transform: scale(1.05);
        box-shadow: 0 0 12px rgba(255, 70, 85, 0.5);
      }

      a {
        color: inherit;
        text-decoration: none;
      }
    </style>
</head>

<body>

    <h1>Second Question</h1>

    <p>Which agent is known for using explosive abilities and high‑mobility plays?</p>

    
    <div class="images">
      <img src="raze.png" alt="Raze">
      <img src="killjoy.png" alt="Killjoy">
    </div>

 
    <div class="options">
      <button><a href="third.html">Raze</a></button>
      <p>or</p>
      <button><a href="wrong.html">Killjoy</a></button>
    </div>

</body>
</html>
