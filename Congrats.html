<html>
<head>
    <title>Mission Complete</title>
    <meta charset="UTF-8">

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

      body {
        background: radial-gradient(circle at top, #0f1923, #000);
        color: #FF4655;
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
        animation: fadeIn 1s ease-in-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      h1 {
        font-size: 42px;
        margin-top: 40px;
        letter-spacing: 2px;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255, 70, 85, 0.6);
      }

      p {
        font-size: 22px;
        max-width: 800px;
        margin: 20px auto;
        color: #d1d5db;
        line-height: 1.5;
      }

      img {
        height: 260px;
        margin: 25px auto;
        border: 2px solid #FF4655;
        border-radius: 12px;
        display: block;
        transition: 0.3s;
        filter: drop-shadow(0px 0px 10px #ff4655);
      }

      img:hover {
        transform: scale(1.05);
        box-shadow: 0 0 18px rgba(255, 70, 85, 0.5);
      }

      button {
        background: transparent;
        padding: 14px 34px;
        border: 2px solid #FF4655;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.3s;
        font-size: 22px;
        color: #FF4655;
        font-family: 'Orbitron', sans-serif;
        margin-top: 20px;
      }

      button:hover {
        background-color: #FF4655;
        color: white;
        transform: scale(1.08);
        box-shadow: 0 0 12px rgba(255, 70, 85, 0.5);
      }

      a {
        color: inherit;
        text-decoration: none;
      }
    </style>
</head>

<body>

    <h1>Mission Complete, Agent.</h1>

    <p>
      You have successfully completed the Valorant Quiz.  
      Your knowledge, precision, and instincts are worthy of the Protocol.
    </p>

    <img src="omen.jpg" alt="Omen">

    <button><a href="welcomepage.html">Return to Start</a></button>

</body>
</html>
